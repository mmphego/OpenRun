name: Signed APK release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'mmphego/OpenRun'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate trusted version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use vMAJOR.MINOR.PATCH'; exit 1; }
          git merge-base --is-ancestor HEAD origin/main || { echo 'Release commit must be on main'; exit 1; }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: true
      - name: Checks without signing credentials
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"
          python3 -m pip install -r server/requirements.txt
          bash scripts/check.sh
      - name: Sign and package release
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RWUN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RWUN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RWUN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RWUN_RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          for variable in KEYSTORE_BASE64 RWUN_KEYSTORE_PASSWORD RWUN_KEY_ALIAS RWUN_KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then echo "::error::Missing release signing secret for $variable. See docs/RELEASING.md."; exit 1; fi
          done
          export RWUN_KEYSTORE_PATH="$RUNNER_TEMP/openrun-release.keystore"
          trap 'rm -f "$RWUN_KEYSTORE_PATH"' EXIT
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RWUN_KEYSTORE_PATH"
          ./gradlew --no-daemon :app:verifyReleaseSigning :app:assembleRelease
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          mkdir -p release-assets
          name="OpenRun-${RWUN_RELEASE_VERSION#v}.apk"
          cp "$apk" "release-assets/$name"
          (cd release-assets && sha256sum "$name" > "$name.sha256")
      - name: Create release and attach APK/checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "OpenRun ${RELEASE_TAG#v}" --generate-notes
          gh release upload "$RELEASE_TAG" release-assets/*.apk release-assets/*.sha256
          gh release edit "$RELEASE_TAG" --draft=false
      - name: Upload release reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OpenRun-release-reports-${{ github.ref_name }}
          path: |
            app/build/reports/
            app/build/test-results/
            build/reports/
          retention-days: 7
          if-no-files-found: warn
