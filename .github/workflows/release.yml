name: GitHub APK release
on:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: signed-releases
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'mmphego/OpenRun'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve release identity
        id: identity
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [ "$REF_TYPE" = tag ]; then
            [[ "$REF_NAME" = "v$version" ]] || { echo 'Version tag must match versionName'; exit 1; }
          fi
          # Full history makes the code deterministic on retries and increasing on main.
          code=$((100000 + $(git rev-list --count HEAD)))
          tag="v${version}-build.${code}"
          if [ "$REF_TYPE" = tag ]; then tag="$REF_NAME"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "OPENRUN_VERSION_CODE=$code" >> "$GITHUB_ENV"
      - name: Validate trusted version tag
        env:
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-build\.[0-9]+)?$ ]] || { echo 'Invalid release tag'; exit 1; }
          git merge-base --is-ancestor HEAD origin/main || { echo 'Release commit must be on main'; exit 1; }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: true
      - name: APK distribution regressions
        run: python3 -m unittest discover -s tests/ci -v
      - name: Check stable signing configuration
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_SIGNING_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          for variable in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD EXPECTED_SIGNING_SHA256; do
            if [ -z "${!variable}" ]; then
              echo '::error::Stable APK signing is not configured. Run scripts/configure-signing.sh; see docs/RELEASING.md.'
              exit 1
            fi
          done
      - name: Checks without signing credentials
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"
          python3 -m pip install -r server/requirements.txt
          bash scripts/check.sh
      - name: Select signing mode and package APK
        id: package
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RWUN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RWUN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RWUN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RWUN_RELEASE_VERSION: v${{ steps.identity.outputs.version }}
          EXPECTED_SIGNING_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: bash scripts/package-release-apk.sh
      - name: Retain signed APK and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OpenRun-signed-${{ steps.identity.outputs.tag }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
      - name: Create release and attach APK/checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
        run: |
          set -euo pipefail
          # Never replace a published binary, including on workflow reruns.
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/release-draft"; then
            if [ "$(cat "$RUNNER_TEMP/release-draft")" != true ]; then
              echo "Release already published; leaving its assets unchanged."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --title "OpenRun ${RELEASE_TAG#v}" --generate-notes
          fi
          python3 scripts/release-notes.py release-assets "${{ steps.package.outputs.variant }}" > "$RUNNER_TEMP/release-notes.md"
          gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$RELEASE_TAG" -f target_commitish="$GITHUB_SHA" --jq '.body' >> "$RUNNER_TEMP/release-notes.md"
          gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release upload "$RELEASE_TAG" release-assets/*.apk release-assets/*.sha256 --clobber
          # An older queued/tagged commit must not displace a newer main release.
          git fetch origin main
          latest=false
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then latest=true; fi
          gh release edit "$RELEASE_TAG" --draft=false --latest="$latest"
      - name: Upload release reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OpenRun-release-reports-${{ github.ref_name }}
          path: |
            app/build/reports/
            app/build/test-results/
            build/reports/
          retention-days: 7
          if-no-files-found: warn
