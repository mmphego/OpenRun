name: Bug report
description: Report a reproducible defect using synthetic data.
title: "[Bug]: "
body:
  - type: textarea
    id: behaviour
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include a minimal synthetic example. Do not attach private routes, health data or credentials.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version or commit, Android API and device
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitised evidence and logs
